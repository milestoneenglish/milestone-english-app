<!-- Tampilan halaman link. Dipakai halaman publik (Index) dan pratinjau di halaman admin (Admin). -->
<style>
  .lt {
    --bg: #0b1426; --text: #ffffff; --btn: #ffffff; --btn-text: #152949;
    --accent: #f17a16; --accent-text: #152949; --radius: 999px; --hover: rgba(255,255,255,.12);
    min-height: 100vh; display: flex; justify-content: center; box-sizing: border-box;
    padding: 44px 16px 28px; background-color: var(--bg); background-image: var(--glow, none);
    color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .lt *, .lt *::before, .lt *::after { box-sizing: border-box; }
  .lt.is-preview { min-height: 100%; padding-top: 36px; }
  .lt-wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .lt-logo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; display: block;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
  .lt-logo.is-raw { width: auto; height: auto; max-width: 220px; max-height: 96px; border-radius: 0; box-shadow: none; object-fit: contain; }
  .lt-initial { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-text); font-size: 36px; font-weight: 800; }
  .lt-name { font-size: 22px; font-weight: 800; line-height: 1.25; margin: 18px 0 6px; letter-spacing: -.01em; }
  .lt-bio { font-size: 15px; line-height: 1.55; opacity: .82; margin: 0; max-width: 420px; white-space: pre-line; overflow-wrap: anywhere; }
  .lt-social { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 14px; }
  .lt-social a { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--text); text-decoration: none; }
  .lt-social a:hover, .lt-social a:focus-visible { background: var(--hover); }
  .lt-social svg { width: 24px; height: 24px; }
  .lt-links { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
  .lt-btn { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 8px; min-height: 58px;
    padding: 10px 16px; border-radius: var(--radius); background: var(--btn); color: var(--btn-text);
    text-decoration: none; font-size: 16px; font-weight: 700; line-height: 1.3;
    box-shadow: 0 2px 0 rgba(0,0,0,.18); transition: transform .15s ease, box-shadow .15s ease; overflow-wrap: anywhere; }
  .lt-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.22); }
  .lt-btn:active { transform: scale(.98); }
  .lt-btn:focus-visible, .lt-social a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .lt-btn svg { width: 22px; height: 22px; }
  .lt-btn small { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; opacity: .75; }
  .lt-btn.is-featured { min-height: 66px; font-size: 17px; background: var(--accent); color: var(--accent-text); }
  .lt-empty { margin-top: 26px; font-size: 14px; opacity: .7; }
  .lt-foot { margin-top: 36px; font-size: 13px; opacity: .6; }
  @media (prefers-reduced-motion: reduce) { .lt-btn { transition: none; } .lt-btn:hover { transform: none; } }
</style>
<script>
  var LT_ICONS = {
    link: '<path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>',
    form: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 13l2 2 4-4"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    book: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
    cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v5"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6 6 0 0 1 3.5 6"/>',
    tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
    chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/>',
    whatsapp: '<path d="M20.5 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.2-4.2A8.5 8.5 0 1 1 20.5 12z"/><path d="M9 8.5c0 3.5 2.8 6.5 6.5 6.5l1-1.6-2-1-1 .9a4.5 4.5 0 0 1-2.8-2.8l.9-1-1-2z"/>',
    pin: '<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/>',
    tiktok: '<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 2.8 2.4 4.6 5 5"/>',
    youtube: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor"/>',
    facebook: '<path d="M14 21v-8h3l.5-3.5H14V7.5c0-1 .4-1.7 1.8-1.7h1.8V2.7a24 24 0 0 0-2.8-.2c-2.7 0-4.3 1.6-4.3 4.5v2.5h-3V13h3v8"/>',
    email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'
  };
  var LT_SOCIAL = [
    ['instagram', 'Instagram', 'instagram'], ['tiktok', 'TikTok', 'tiktok'], ['youtube', 'YouTube', 'youtube'],
    ['facebook', 'Facebook', 'facebook'], ['email', 'Email', 'email'], ['website', 'Website', 'globe']
  ];
  var LT_RADIUS = { bulat: '999px', lengkung: '16px', kotak: '6px' };

  function ltIcon(name) {
    if (!LT_ICONS[name]) return '<span></span>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + LT_ICONS[name] + '</svg>';
  }

  function ltEsc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ltRgba(hex, alpha) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return 'rgba(255,255,255,' + alpha + ')';
    var n = parseInt(m[1], 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  function ltWaNumber(v) {
    var d = String(v || '').replace(/\D/g, '');
    if (d.charAt(0) === '0') d = '62' + d.slice(1);
    else if (d.charAt(0) === '8') d = '62' + d;
    return d;
  }

  /** Sama dengan socialHref_ di Code.gs, supaya pratinjau sama persis dengan hasil simpan. */
  function ltSocialHref(key, v) {
    v = String(v || '').trim();
    if (!v) return '';
    if (key === 'email') return /^(mailto:)?[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? 'mailto:' + v.replace(/^mailto:/, '') : '';
    if (/^https?:\/\//i.test(v)) return v;
    var handle = v.replace(/^@/, '');
    var base = { instagram: 'https://instagram.com/', tiktok: 'https://www.tiktok.com/@', youtube: 'https://www.youtube.com/@', facebook: 'https://facebook.com/' }[key];
    if (base && /^[\w.-]+$/.test(handle)) return base + handle;
    return 'https://' + v;
  }

  function ltSafeUrl(u) {
    return /^(https?:|mailto:|tel:)/i.test(String(u || '')) ? u : '#';
  }

  /**
   * Tulis halaman link ke dalam elemen root.
   * opts.preview: tampilan pratinjau admin. opts.onGo(item, event): dipanggil saat tombol diklik.
   */
  function renderLinktree(root, data, opts) {
    opts = opts || {};
    var s = data.settings || {};
    var items = (data.links || []).map(function (l) {
      return { id: l.id, title: l.judul, sub: l.keterangan, url: l.url, icon: l.ikon, featured: l.unggulan };
    });
    var wa = ltWaNumber(s.wa_nomor);
    if (s.wa_tampil === 'ya' && wa) {
      items.push({ id: 'wa', title: s.wa_label || 'Chat via WhatsApp', url: 'https://wa.me/' + wa + (s.wa_pesan ? '?text=' + encodeURIComponent(s.wa_pesan) : ''), icon: 'whatsapp' });
    }
    var social = LT_SOCIAL.map(function (x) {
      return { id: 'sosial:' + x[0], label: x[1], icon: x[2], url: ltSocialHref(x[0], s[x[0]]) };
    }).filter(function (x) { return x.url; });

    root.className = 'lt' + (opts.preview ? ' is-preview' : '');
    var vars = {
      '--bg': s.warna_latar, '--text': s.warna_teks, '--btn': s.warna_tombol, '--btn-text': s.warna_teks_tombol,
      '--accent': s.warna_unggulan, '--accent-text': s.warna_teks_unggulan, '--radius': LT_RADIUS[s.bentuk] || LT_RADIUS.bulat,
      '--hover': ltRgba(s.warna_teks, .14),
      '--glow': 'radial-gradient(120% 60% at 50% -10%, ' + ltRgba(s.warna_unggulan, .28) + ', transparent 70%)'
    };
    Object.keys(vars).forEach(function (k) { if (vars[k]) root.style.setProperty(k, vars[k]); });

    var name = s.nama || 'Milestone English';
    var logo = s.logo
      ? '<img class="lt-logo' + (s.logo_bentuk === 'asli' ? ' is-raw' : '') + '" src="' + ltEsc(s.logo) + '" alt="Logo ' + ltEsc(name) + '">'
      : '<div class="lt-initial" aria-hidden="true">' + ltEsc(name.charAt(0).toUpperCase()) + '</div>';
    var all = items.concat(social);
    var html = '<div class="lt-wrap">' + logo +
      '<h1 class="lt-name">' + ltEsc(name) + '</h1>' +
      (s.bio ? '<p class="lt-bio">' + ltEsc(s.bio) + '</p>' : '') +
      (social.length ? '<div class="lt-social">' + social.map(function (x) {
        return '<a href="' + ltEsc(ltSafeUrl(x.url)) + '" target="_top" rel="noopener" aria-label="' + x.label + '" title="' + x.label + '" data-go="' + all.indexOf(x) + '">' + ltIcon(x.icon) + '</a>';
      }).join('') + '</div>' : '') +
      (items.length ? '<nav class="lt-links" aria-label="Link">' + items.map(function (x, i) {
        return '<a class="lt-btn' + (x.featured ? ' is-featured' : '') + '" href="' + ltEsc(ltSafeUrl(x.url)) + '" target="_top" rel="noopener" data-go="' + i + '">' +
          ltIcon(x.icon === 'none' ? '' : x.icon) +
          '<span>' + ltEsc(x.title) + (x.sub ? '<small>' + ltEsc(x.sub) + '</small>' : '') + '</span><span></span></a>';
      }).join('') + '</nav>' : (opts.preview ? '<p class="lt-empty">Belum ada link yang tampil hari ini.</p>' : '')) +
      (s.footer ? '<p class="lt-foot">' + ltEsc(s.footer) + '</p>' : '') +
      '</div>';
    root.innerHTML = html;
    Array.prototype.forEach.call(root.querySelectorAll('[data-go]'), function (a) {
      a.addEventListener('click', function (ev) {
        if (opts.onGo) opts.onGo(all[Number(a.getAttribute('data-go'))], ev);
      });
    });
  }
</script>
