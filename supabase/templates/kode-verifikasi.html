<!-- Template email kode verifikasi akun baru. Dipakai setelah SMTP sendiri (Resend) aktif di Fase 2:
     tempel di Supabase Dashboard > Authentication > Emails > Confirm signup. -->
<div style="background:#070E1B;padding:32px 16px;font-family:Inter,Arial,sans-serif">
  <div style="max-width:480px;margin:0 auto;background:#101F38;border:1px solid #F58220;border-radius:16px;padding:32px">
    <p style="margin:0;color:#FBD38D;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:700">Milestone English</p>
    <h1 style="margin:12px 0 0;color:#F58220;font-size:24px">Kode verifikasi akun</h1>
    <p style="margin:12px 0 24px;color:#FEEBC8;font-size:14px;line-height:1.6">Masukkan kode berikut untuk mengaktifkan akunmu. Kode berlaku 10 menit dan hanya bisa dipakai sekali.</p>
    <p style="margin:0;text-align:center;background:#070E1B;border:2px solid #F58220;border-radius:12px;padding:16px;color:#FFFFFF;font-size:32px;font-weight:800;letter-spacing:10px">{{ .Token }}</p>
    <p style="margin:24px 0 0;color:#94A3B8;font-size:12px;line-height:1.6">Jika kamu tidak meminta kode ini, abaikan email ini. Akunmu tetap aman.</p>
  </div>
</div>
